<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lupo’s Use-At-Your-Own-Risk Gold Valuator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #1c2236;
  --card: #2a3050;
  --accent: #3dd6c6;
  --text: #e6e8f0;
  --muted: #9aa3c7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--text);
}

h1 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
}

.container {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: linear-gradient(180deg, #30386a, var(--card));
  border-radius: 16px;
  padding: 20px;
}

label {
  font-size: 13px;
  color: var(--muted);
}

input, select {
  width: 100%;
  margin-top: 6px;
  margin-bottom: 14px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #1c2236;
  color: var(--text);
  font-size: 15px;
}

.value-big {
  font-size: 34px;
  font-weight: 700;
}

.value-small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
}

.toggle {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.toggle button {
  flex: 1;
  background: #1c2236;
  border: none;
  padding: 10px;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
}

.toggle button.active {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.coin-card {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.coin-card img {
  max-width: 300px;
  width: 100%;
  height: auto;
  border-radius: 50%;
  box-shadow:
    0 0 40px rgba(255, 215, 100, 0.25),
    inset 0 0 20px rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<h1>Lupo’s Use-At-Your-Own-Risk Gold Valuator</h1>
<div class="subtitle">
  Market & Bank of Israel reference rates · Indicative only
</div>

<div class="container">

  <!-- INPUTS -->
  <div class="card">
    <label>Weight (grams)</label>
    <input id="weight" type="number" value="31.1">

    <label>Karat</label>
    <select id="karat">
      <option value="24">24k</option>
      <option value="22" selected>22k</option>
      <option value="21">21k</option>
      <option value="18">18k</option>
    </select>

    <label>Coin Premium (%)</label>
    <input id="premium" type="number" value="4">
  </div>

  <!-- VALUE -->
  <div class="card">
    <div class="toggle">
      <button id="marketBtn" class="active">Market</button>
      <button id="boiBtn">BOI</button>
    </div>

    <div class="value-big" id="ilsValue">₪ —</div>
    <div class="value-small" id="usdValue">$ —</div>
    <div class="value-small" id="fxInfo">Loading prices…</div>
  </div>

  <!-- IMAGE -->
  <div class="card coin-card">
    <img src="coin.png" alt="Gold Coin">
  </div>

</div>

<script>
/* ========= STATE ========= */
let fxMode = "market";
let workerData = null;

/* ========= ELEMENTS ========= */
const weight = document.getElementById("weight");
const karat = document.getElementById("karat");
const premium = document.getElementById("premium");
const ilsValue = document.getElementById("ilsValue");
const usdValue = document.getElementById("usdValue");
const fxInfo = document.getElementById("fxInfo");
const marketBtn = document.getElementById("marketBtn");
const boiBtn = document.getElementById("boiBtn");

/* ========= TOGGLE ========= */
marketBtn.onclick = () => setFx("market");
boiBtn.onclick = () => setFx("boi");

function setFx(mode) {
  fxMode = mode;
  marketBtn.classList.toggle("active", mode === "market");
  boiBtn.classList.toggle("active", mode === "boi");
  calculate();
}

/* ========= FETCH ========= */
async function loadPrices() {
  try {
    const res = await fetch("https://gold-proxy.avilupo.workers.dev");
    workerData = await res.json();
    calculate();
  } catch {
    fxInfo.textContent = "Failed to load prices";
  }
}

/* ========= CALC ========= */
function calculate() {
  if (!workerData?.gold) return;

  const w = Number(weight.value) || 0;
  const k = Number(karat.value) / 24;
  const p = Number(premium.value) / 100;

  const usdPerGram = workerData.gold.price / 31.1035;
  const usd = w * k * usdPerGram * (1 + p);

  const fx =
    fxMode === "market"
      ? workerData.fx?.market?.usdIls
      : workerData.fx?.boi?.usdIls;

  if (!fx) return;

  ilsValue.textContent = "₪ " + Math.round(usd * fx);
  usdValue.textContent = "$ " + usd.toFixed(2);

  fxInfo.textContent =
    fxMode === "market"
      ? "Market FX"
      : "BOI " + workerData.fx.boi.date;
}

/* ========= EVENTS ========= */
document.querySelectorAll("input, select")
  .forEach(el => el.addEventListener("input", calculate));

loadPrices();
</script>

</body>
</html>
