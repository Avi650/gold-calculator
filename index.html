<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gold Value Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f4f4f4;
    padding: 20px;
    max-width: 480px;
    margin: auto;
  }
  h2 { text-align: center; }
  label { font-weight: 600; margin-top: 12px; display: block; }
  input, select, button {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    margin-top: 4px;
  }
  button { margin-top: 14px; cursor: pointer; }
  .result {
    margin-top: 20px;
    background: white;
    padding: 16px;
    border-radius: 8px;
  }
  .value { font-size: 22px; font-weight: bold; }
  .small { font-size: 13px; color: #555; margin-top: 4px; }
</style>
</head>

<body>

<h2>Gold Value Calculator</h2>

<label>Item Type</label>
<select id="type">
  <option value="scrap">Scrap / Jewelry</option>
  <option value="coin">Bullion Coin</option>
</select>

<label>Weight (grams)</label>
<input id="weight" type="number" step="0.01" value="31.1">

<label>Karat</label>
<select id="karat">
  <option value="24">24k</option>
  <option value="22" selected>22k</option>
  <option value="21">21k</option>
  <option value="18">18k</option>
  <option value="14">14k</option>
</select>

<label>Coin Premium (%)</label>
<input id="premium" type="number" step="0.1" value="4">

<hr>

<label>Gold Spot (USD / oz)</label>
<input id="goldUSDoz" type="number" step="0.01" value="0">

<label>USD → ILS</label>
<input id="usdIls" type="number" step="0.001" value="0">

<button id="fetchBtn">Fetch Live Prices</button>

<div class="result">
  <div class="value" id="ilsValue">₪ —</div>
  <div class="small" id="usdValue">$ —</div>
  <div class="small" id="spotInfo">Manual prices</div>
</div>

<script>
const GOLD_API_KEY = "goldapi-1g7qhsmkwetbhn-io";

function el(id) { return document.getElementById(id); }
function num(id, d=0) { const e = el(id); return e ? Number(e.value)||d : d; }

function calculate() {
  const weight = num("weight");
  const karat = num("karat", 24);
  const premium = num("premium");
  const type = el("type").value;

  const goldUSDoz = num("goldUSDoz");
  const usdIls = num("usdIls");
  if (!goldUSDoz || !usdIls) return;

  const purity = karat / 24;
  let usd = (weight * purity) * (goldUSDoz / 31.1035);
  if (type === "coin") usd *= (1 + premium / 100);

  el("usdValue").textContent = "$ " + usd.toFixed(2);
  el("ilsValue").textContent = "₪ " + Math.round(usd * usdIls);
}

async function fetchLive() {
  try {
    const g = await fetch("https://gold-proxy.ba58cf4d2882d5d8b58879344a9e53cd.workers.dev")

    }).then(r => r.json());

    el("goldUSDoz").value = g.price.toFixed(2);

    const fx = await fetch(
      "https://api.exchangerate.host/latest?base=USD&symbols=ILS"
    ).then(r => r.json());

    el("usdIls").value = fx.rates.ILS.toFixed(3);

    el("spotInfo").textContent =
      `Gold bid ${g.bid.toFixed(2)} / ask ${g.ask.toFixed(2)} USD — ` +
      new Date(g.timestamp * 1000).toLocaleString();

  } catch {
    alert("Failed to fetch live prices");
  }
  calculate();
}

document.getElementById("fetchBtn").addEventListener("click", fetchLive);
document.querySelectorAll("input, select")
  .forEach(e => e.addEventListener("input", calculate));
</script>

</body>
</html>
