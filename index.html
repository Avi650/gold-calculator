<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gold Value Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f4f4f4;
    padding: 20px;
    max-width: 480px;
    margin: auto;
  }
  h2 {
    text-align: center;
  }
  label {
    font-weight: 600;
    margin-top: 12px;
    display: block;
  }
  input, select, button {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    margin-top: 4px;
  }
  button {
    margin-top: 14px;
    cursor: pointer;
  }
  .result {
    margin-top: 20px;
    background: white;
    padding: 16px;
    border-radius: 8px;
  }
  .value {
    font-size: 22px;
    font-weight: bold;
  }
  .small {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
  }
  hr {
    margin-top: 16px;
  }
</style>
</head>

<body>

<h2>Gold Value Calculator</h2>

<label>Item Type</label>
<select id="type">
  <option value="scrap">Scrap / Jewelry</option>
  <option value="coin">Bullion Coin</option>
</select>

<label>Weight (grams)</label>
<input id="weight" type="number" step="0.01" value="31.1">

<label>Karat</label>
<select id="karat">
  <option value="24">24k</option>
  <option value="22" selected>22k</option>
  <option value="21">21k</option>
  <option value="18">18k</option>
  <option value="14">14k</option>
</select>

<label>Coin Premium (%)</label>
<input id="premium" type="number" step="0.1" value="4">

<hr>

<label>Gold Spot (USD / oz)</label>
<input id="goldUSDoz" type="number" step="0.01" value="0">

<label>USD → ILS</label>
<input id="usdIls" type="number" step="0.001" value="0">

<button onclick="fetchLive()">Fetch Live Prices</button>

<div class="result">
  <div class="value" id="ilsValue">₪ —</div>
  <div class="small" id="usdValue">$ —</div>
  <div class="small" id="spotInfo">Manual prices</div>
</div>

<script defer>
/* ================= CONFIG ================= */
const GOLD_API_KEY = "goldapi-1g7qhsmkwetbhn-io";

/* ================= HELPERS ================= */
function el(id) {
  return document.getElementById(id);
}
function num(id, fallback = 0) {
  const e = el(id);
  return e && e.value !== "" ? Number(e.value) || fallback : fallback;
}
function str(id, fallback = "") {
  const e = el(id);
  return e ? e.value : fallback;
}

/* ================= CALCULATION ================= */
function calculate() {
  const weight = num("weight");
  const karat = num("karat", 24);
  const premium = num("premium");
  const type = str("type", "scrap");

  const goldUSDoz = num("goldUSDoz");
  const usdIls = num("usdIls");

  if (!goldUSDoz || !usdIls) return;

  const purity = karat / 24;
  const pureGold = weight * purity;
  const usdPerGram = goldUSDoz / 31.1035;

  let valueUSD = pureGold * usdPerGram;
  if (type === "coin") valueUSD *= (1 + premium / 100);

  const valueILS = valueUSD * usdIls;

  el("usdValue").textContent = "$ " + valueUSD.toFixed(2);
  el("ilsValue").textContent = "₪ " + Math.round(valueILS);
}

/* ================= LIVE FETCH ================= */
async function fetchLive() {
  try {
    // GOLD (real market)
    const goldRes = await fetch("https://www.goldapi.io/api/XAU/USD", {
      headers: { "x-access-token": GOLD_API_KEY }
    });
    const gold = await goldRes.json();

    if (!gold.price) throw new Error("Gold API error");

    el("goldUSDoz").value = gold.price.toFixed(2);

    // FX USD → ILS
    const fxRes = await fetch(
      "https://api.exchangerate.host/latest?base=USD&symbols=ILS"
    );
    const fx = await fxRes.json();

    el("usdIls").value = fx.rates.ILS.toFixed(3);

    const ts = new Date(gold.timestamp * 1000).toLocaleString();
    el("spotInfo").textContent =
      `Gold bid ${gold.bid.toFixed(2)} / ask ${gold.ask.toFixed(2)} USD — ${ts}`;

  } catch (err) {
    alert("Failed to fetch live prices.\nManual values remain valid.");
  }

  calculate();
}
function v(id, fallback = 0) {
  const el = document.getElementById(id);
  return el && el.value !== "" ? Number(el.value) || fallback : fallback;
}

function s(id, fallback = "") {
  const el = document.getElementById(id);
  return el ? el.value : fallback;
}

function calculate() {
  const weight = v("weight");
  const karat = v("karat", 24);
  const premium = v("premium");
  const type = s("type", "scrap");

  const goldUSDoz = v("goldUSDoz");
  const usdIls = v("usdIls");

  if (!goldUSDoz || !usdIls) return;

  const purity = karat / 24;
  const pureGold = weight * purity;
  const usdPerGram = goldUSDoz / 31.1035;

  let valueUSD = pureGold * usdPerGram;
  if (type === "coin") valueUSD *= (1 + premium / 100);

  const valueILS = valueUSD * usdIls;

  const usdEl = document.getElementById("usdValue");
  const ilsEl = document.getElementById("ilsValue");

  if (usdEl) usdEl.textContent = "$ " + valueUSD.toFixed(2);
  if (ilsEl) ilsEl.textContent = "₪ " + Math.round(valueILS);
}

  );
});
</script>

</body>
</html>
