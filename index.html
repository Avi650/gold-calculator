<script defer>
  "use strict";

const GOLD_API_KEY = "goldapi-1g7qhsmkwetbhn-io";

function calculate() {
  const weight = Number(weightInput.value) || 0;
  const karat = Number(karatInput.value) || 24;
  const premium = Number(premiumInput.value) || 0;
  const type = typeInput.value;

  const goldUSDoz = Number(goldInput.value) || 0;
  const usdIls = Number(usdIlsInput.value) || 0;

  const purity = karat / 24;
  const pureGold = weight * purity;
  const usdPerGram = goldUSDoz / 31.1035;

  let valueUSD = pureGold * usdPerGram;
  if (type === "coin") valueUSD *= (1 + premium / 100);

  const valueILS = valueUSD * usdIls;

  usdValue.textContent = "$ " + valueUSD.toFixed(2);
  ilsValue.textContent = "₪ " + Math.round(valueILS);
}

async function fetchLive() {
  try {
    // --- GOLD (real market spot with bid/ask) ---
    const goldRes = await fetch("https://www.goldapi.io/api/XAU/USD", {
      headers: {
        "x-access-token": GOLD_API_KEY
      }
    });
    const goldData = await goldRes.json();

    if (!goldData.price) {
      throw new Error("GoldAPI returned invalid data");
    }

    goldInput.value = goldData.price.toFixed(2);

    // --- FX USD → ILS ---
    const fxRes = await fetch(
      "https://api.exchangerate.host/latest?base=USD&symbols=ILS"
    );
    const fxData = await fxRes.json();

    usdIlsInput.value = fxData.rates.ILS.toFixed(3);

    const ts = new Date(goldData.timestamp * 1000).toLocaleString();

    spotInfo.textContent =
      `Gold bid ${goldData.bid.toFixed(2)} / ask ${goldData.ask.toFixed(2)} USD — ${ts}`;

  } catch (e) {
    alert("Failed to fetch live prices.\nManual values remain valid.");
  }

  calculate();
}

// --- DOM bindings ---
const weightInput = document.getElementById("weight");
const karatInput = document.getElementById("karat");
const premiumInput = document.getElementById("premium");
const goldInput = document.getElementById("goldUSDoz");
const usdIlsInput = document.getElementById("usdIls");
const typeInput = document.getElementById("type");

const usdValue = document.getElementById("usdValue");
const ilsValue = document.getElementById("ilsValue");
const spotInfo = document.getElementById("spotInfo");

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", calculate)
);

calculate();
</script>
