<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lupo’s Gold Valuator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #1e2337;
  --card: #2a3050;
  --accent: #3dd6c6;
  --text: #e6e8f0;
  --muted: #9aa3c7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--text);
}

h1 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 24px;
}

.container {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: linear-gradient(180deg, #2e355c, var(--card));
  border-radius: 14px;
  padding: 18px;
}

label {
  font-size: 13px;
  color: var(--muted);
}

input, select {
  width: 100%;
  margin-top: 6px;
  margin-bottom: 14px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #1e2337;
  color: var(--text);
}

.value-big {
  font-size: 32px;
  font-weight: 700;
}

.value-small {
  color: var(--muted);
  margin-top: 4px;
}

.toggle {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.toggle button {
  flex: 1;
  background: #1e2337;
  border: none;
  padding: 10px;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
}

.toggle button.active {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.chart-card {
  grid-column: 1 / -1;
  height: 300px;
}

.chart-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.chart-controls button {
  background: #1e2337;
  border: none;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.chart-controls button.active {
  background: var(--accent);
  color: #000;
}
</style>
</head>

<body>

<h1>Lupo’s Use-At-Your-Own-Risk Gold Valuator</h1>
<div class="subtitle">
  Market & Bank of Israel reference rates · Indicative only
</div>

<div class="container">

  <!-- INPUT CARD -->
  <div class="card">
    <label>Weight (grams)</label>
    <input id="weight" type="number" value="31.1">

    <label>Karat</label>
    <select id="karat">
      <option value="24">24k</option>
      <option value="22" selected>22k</option>
      <option value="21">21k</option>
      <option value="18">18k</option>
    </select>

    <label>Coin Premium (%)</label>
    <input id="premium" type="number" value="4">
  </div>

  <!-- VALUE CARD -->
  <div class="card">
    <div class="toggle">
      <button id="marketBtn" class="active">Market</button>
      <button id="boiBtn">BOI</button>
    </div>

    <div class="value-big" id="ilsValue">₪ —</div>
    <div class="value-small" id="usdValue">$ —</div>
    <div class="value-small" id="fxInfo">—</div>
  </div>
  
<!-- COIN IMAGE -->
<div class="card chart-card coin-card">
  <img src="coin.png" alt="Gold Coin">
</div>

<script>
/* ================= CONFIG ================= */
const WORKER_URL = "https://gold-proxy.avilupo.workers.dev";
const TD_API_KEY = "YOUR_TWELVE_DATA_KEY";

/* ================= DOM ================= */
const weight = document.getElementById("weight");
const karat = document.getElementById("karat");
const premium = document.getElementById("premium");
const ilsValue = document.getElementById("ilsValue");
const usdValue = document.getElementById("usdValue");
const fxInfo = document.getElementById("fxInfo");
const marketBtn = document.getElementById("marketBtn");
const boiBtn = document.getElementById("boiBtn");

/* ================= STATE ================= */
let fxMode = "market";
let workerData = null;

/* ================= FX TOGGLE ================= */
marketBtn.onclick = () => setFx("market");
boiBtn.onclick = () => setFx("boi");

function setFx(mode) {
  fxMode = mode;
  marketBtn.classList.toggle("active", mode === "market");
  boiBtn.classList.toggle("active", mode === "boi");
  calculate();
}

/* ================= LOAD LIVE DATA ================= */
async function loadPrices() {
  const res = await fetch(WORKER_URL);
  workerData = await res.json();
  calculate();
}

/* ================= CALCULATION ================= */
function calculate() {
  if (!workerData) return;

  const w = +weight.value;
  const purity = +karat.value / 24;
  const prem = +premium.value / 100;

  const usdPerGram = workerData.gold.price / 31.1035;
  const usd = w * purity * usdPerGram * (1 + prem);

  const fx = fxMode === "market"
    ? workerData.fx.market.usdIls
    : workerData.fx.boi.usdIls;

  ilsValue.textContent = "₪ " + Math.round(usd * fx);
  usdValue.textContent = "$ " + usd.toFixed(2);

  fxInfo.textContent = fxMode === "market"
    ? "Market FX"
    : "BOI " + workerData.fx.boi.date;
}

document.querySelectorAll("input, select")
  .forEach(e => e.addEventListener("input", calculate));

/* ================= CHART ================= */
const ctx = document.getElementById("goldChart");
const goldChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      data: [],
      borderColor: "#3dd6c6",
      borderWidth: 2,
      tension: 0.25,
      pointRadius: 0
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: "#9aa3c7" } },
      y: { ticks: { color: "#9aa3c7" } }
    }
  }
});

/* ================= HISTORICAL GOLD ================= */
const RANGE_MAP = {
  "1D": { interval: "15min", output: 96 },
  "1W": { interval: "1h", output: 168 },
  "1M": { interval: "1day", output: 30 },
  "1Y": { interval: "1week", output: 52 },
  "5Y": { interval: "1month", output: 60 },
  "10Y": { interval: "1month", output: 120 }
};

async function loadGoldHistory(range) {
  const cfg = RANGE_MAP[range];
  if (!cfg) return;

  const url =
    `https://api.twelvedata.com/time_series` +
    `?symbol=XAU/USD&interval=${cfg.interval}` +
    `&outputsize=${cfg.output}&apikey=${TD_API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();
  if (!data.values) return;

  const values = data.values.reverse();
  goldChart.data.labels = values.map(v => v.datetime);
  goldChart.data.datasets[0].data =
    values.map(v => parseFloat(v.close));
  goldChart.update();
}

/* ================= CHART BUTTONS ================= */
document.querySelectorAll(".chart-controls button")
  .forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".chart-controls button")
        .forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadGoldHistory(btn.dataset.range);
    };
  });

/* ================= INIT ================= */
loadPrices();
loadGoldHistory("1D");
</script>

</body>
</html>
