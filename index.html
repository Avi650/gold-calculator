<script defer>
const GOLD_API_KEY = "goldapi-1g7qhsmkwetbhn-io";

function calculate() {
  const weight = Number(document.getElementById("weight").value) || 0;
  const karat = Number(document.getElementById("karat").value) || 24;
  const premium = Number(document.getElementById("premium").value) || 0;
  const type = document.getElementById("type").value;

  const goldUSDoz = Number(document.getElementById("goldUSDoz").value) || 0;
  const usdIls = Number(document.getElementById("usdIls").value) || 0;

  const purity = karat / 24;
  const pureGold = weight * purity;
  const usdPerGram = goldUSDoz / 31.1035;

  let valueUSD = pureGold * usdPerGram;
  if (type === "coin") valueUSD *= (1 + premium / 100);

  const valueILS = valueUSD * usdIls;

  document.getElementById("usdValue").textContent = "$ " + valueUSD.toFixed(2);
  document.getElementById("ilsValue").textContent = "₪ " + Math.round(valueILS);
}

async function fetchLive() {
  try {
    const goldRes = await fetch("https://www.goldapi.io/api/XAU/USD", {
      headers: { "x-access-token": GOLD_API_KEY }
    });
    const goldData = await goldRes.json();

    if (!goldData.price) throw new Error("Bad gold data");

    document.getElementById("goldUSDoz").value = goldData.price.toFixed(2);

    const fxRes = await fetch(
      "https://api.exchangerate.host/latest?base=USD&symbols=ILS"
    );
    const fxData = await fxRes.json();

    document.getElementById("usdIls").value = fxData.rates.ILS.toFixed(3);

    const ts = new Date(goldData.timestamp * 1000).toLocaleString();
    document.getElementById("spotInfo").textContent =
      `Gold bid ${goldData.bid.toFixed(2)} / ask ${goldData.ask.toFixed(2)} USD — ${ts}`;
  } catch (e) {
    alert("Failed to fetch live prices.");
  }

  calculate();
}

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", calculate)
);

calculate();
</script>
